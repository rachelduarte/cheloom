<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:" />
    <title>cheloom · Grabando</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="toolbar.css" />
  </head>
  <body>
    <div class="bar">
      <span class="grip" aria-hidden="true"></span>
      <span id="dot" class="dot"></span>
      <span id="time" class="time">0:00</span>

      <button id="pause" class="btn" title="Pausar" aria-label="Pausar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" /></svg>
      </button>
      <button id="stop" class="btn stop" title="Detener y guardar" aria-label="Detener y guardar">
        <span class="square"></span>
      </button>
      <button id="discard" class="btn" title="Descartar" aria-label="Descartar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg>
      </button>
    </div>
    <script type="module" src="toolbar.js"></script>
  </body>
</html>
