<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:" />
    <title>cheloom · Preparando</title>
    <link rel="stylesheet" href="../theme.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      .ring {
        position: fixed;
        inset: 10px;
        border-radius: 50%;
        padding: 5px;
        background: var(--ring);
        cursor: pointer;
      }
      .face {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: rgba(12, 21, 42, 0.92);
        display: grid;
        place-items: center;
        text-align: center;
      }
      #n {
        font-family: var(--font-display);
        font-size: 96px;
        font-weight: 600;
        line-height: 1;
        animation: pop 1s ease-out;
      }
      small {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: var(--lead);
      }
      @keyframes pop {
        from {
          transform: scale(1.35);
          opacity: 0;
        }
        25% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #n {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="ring" title="Clic o Esc para cancelar">
      <div class="face">
        <div>
          <div id="n">3</div>
          <small>Esc para cancelar</small>
        </div>
      </div>
    </div>
    <script type="module" src="countdown.js"></script>
  </body>
</html>
